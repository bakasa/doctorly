services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doctorly
      POSTGRES_USER: doctorly
      POSTGRES_PASSWORD: doctorly
    ports:
      - "55432:5432"
    volumes:
      - doctorly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctorly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  doctorly-db-data:
